name: Deploy to GitHub Pages
# Republish the site after repository visibility was restored to public.

on:
  # Deployment is intentionally initiated by the main-branch workflow,
  # which checks out this feature branch to satisfy Pages environment rules.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pages deployment is authorized from main; source code is taken from the review branch.
      - uses: actions/checkout@v4
        with:
          ref: feature/knowledge-base-ui-review-fixes
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci

      - name: Validate universal knowledge contract
        run: npm test
        
      - name: Build project
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
